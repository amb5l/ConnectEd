[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ConnectEd"
version = "0.1.0"
description = "Development repository for ConnectEd"
authors = [
    {name = "Adam Barnes"}
]
license = {text = "GPL-3.0"}
requires-python = ">=3.11"
dependencies = [
    "antlr4-python3-runtime>=4.13.2",
    "PyQt6>=6.4.0",
    "PyYAML>=6.0",
    "openai>=1.0",
    "anthropic>=0.40",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Software Development :: User Interfaces",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Environment :: MacOS X",
    "Private :: Do Not Upload",  # This prevents accidental upload to PyPI
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "flake8>=3.8",
    "mypy>=0.910",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = [
    "vhdl_lexer\\.py$",
    "vhdl_parser\\.py$",
    "vhdl_parserListener\\.py$",
    "vhdl_parserVisitor\\.py$",
]

[[tool.mypy.overrides]]
module = ["antlr4.*", "openai.*", "anthropic.*", "yaml.*"]
ignore_missing_imports = true

# ANTLR output. Imported by the handwritten VHDL model, so path excludes
# do not keep Mypy out. Same set as tools/coding_style.py SKIP_FILES.
[[tool.mypy.overrides]]
module = [
    "ConnectEd.hdl.vhdl.vhdl_lexer",
    "ConnectEd.hdl.vhdl.vhdl_parser",
    "ConnectEd.hdl.vhdl.vhdl_parserListener",
    "ConnectEd.hdl.vhdl.vhdl_parserVisitor",
]
ignore_errors = true

[tool.setuptools.package-data]
"ConnectEd.core" = ["settings.yaml", "themes/*.yaml"]

[tool.ruff]
# Target Python 3.11+
target-version = "py311"

# Set the maximum line length
line-length = 88

# Exclude directories and ANTLR output (same set as tools/coding_style.py).
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "ConnectEd/hdl/vhdl/vhdl_lexer.py",
    "ConnectEd/hdl/vhdl/vhdl_parser.py",
    "ConnectEd/hdl/vhdl/vhdl_parserListener.py",
    "ConnectEd/hdl/vhdl/vhdl_parserVisitor.py",
]

[tool.ruff.lint]
# Enable specific rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]

# CamelCase is the project style (N802 was already ignored). E501 fights
# the vertical alignment checked by tools/coding_style.py.
ignore = [
    "E501",  # line too long
    "E701",  # multiple statements on one line (colon)
    "N801",  # class name should use CapWords
    "N802",  # function name should be lowercase
    "N803",  # argument name should be lowercase
    "N806",  # variable in function should be lowercase
    "N815",  # mixedCase variable in class scope
    "N999",  # module names should be snake_case (ConnectEd is not)
    "UP037", # remove quotes from type annotation
]

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"