meta:
  id           : light_mono
  display_name : 'Light mono'
palette:
  # basic colours
  black       : '#000000'
  dark_red    : '#400000'
  dark_yellow : '#404000'
  dark_green  : '#004000'
  dark_grey   : '#404040'
  mid_grey    : '#808080'
  white       : '#A0A0A0'
  # functional colours
  select      : '#FF00FF'
  highlight   : '#FFFF00'
presets:
  Background           : black
  Origin               : highlight
  Sheet                : white
  Border               : black
  Grid                 : mid_grey
  FreeNodeUnconnected  : black
  FreeNodeConnected    : black
  FreeNodeJunction     : black
  FixedNodeUnconnected : black
  FixedNodeConnected   : black
  FixedNodeJunction    : black
  SegmentUnresolved    : black
  SegmentScalar        : black
  SegmentVector        : black
  SegmentPreview1      : select
  SegmentPreview2      : select
  TapUnresolved        : black
  TapScalar            : black
  TapVector            : black
  NetLabel             : black
  PortPinWire          : black
  PortPinBus           : black
  PortArrowLine        : black
  PortArrowFill        : white
  PortName             : black
  PortComment          : black
  GateLine             : black
  GateFill             : white
  GatePinWire          : black
  GatePinBus           : black
  GatePinArrowLine     : black
  GatePinArrowFill     : white
  BlockLine            : black
  BlockFill            : white
  BlockLabel           : black
  BlockName            : black
  BlockPinWire         : black
  BlockPinBus          : black
  BlockPinArrowLine    : black
  BlockPinArrowFill    : white
  BlockPinName         : black
  BlockPinComment      : black
  SymbolPinWire        : black
  SymbolPinBus         : black
  SymbolPinArrowLine   : black
  SymbolPinArrowFill   : white
  SymbolPinName        : black
  SymbolPinComment     : black
  PropertyText         : black
  Line                 : black
  RectangleLine        : black
  RectangleFill        : black
  EllipseLine          : black
  EllipseFill          : black
  PolyVtx              : black
  PolylineLine         : black
  PolylineFill         : black
  Text                 : black
  SelectedLine         : select
  SelectedFill         : select
  SelectedText         : select
  Grip                 : select
  Rubber               : highlight
  PropertyDeleted      : dark_red
  PropertyChanged      : dark_yellow
  PropertyAdded        : dark_green
background : '@Background'
origin:
  color : '@Origin'
  size  : 12
sheet  : '@Sheet'
border : '@Origin'
items:
  FreeNode:
    size : 3
    unconnected:
      line:
        color : '@Origin'
        width : 0
        style : SolidLine
      fill:
        color : '@Origin'
        style : NoBrush
    connected:
      line:
        color : '@Origin'
        width : 0
        style : SolidLine
      fill:
        color : '@Origin'
        style : NoBrush
    junction:
      line:
        color : '@Origin'
        width : 0
        style : NoPen
      fill:
        color : '@Origin'
        style : SolidPattern
  FixedNode:
    size : 3
    unconnected:
      line:
        color : '@Origin'
        width : 0
        style : SolidLine
      fill:
        color : '@Origin'
        style : NoBrush
    connected:
      line:
        color : '@Origin'
        width : 0
        style : SolidLine
      fill:
        color : '@Origin'
        style : NoBrush
    junction:
      line:
        color : '@Origin'
        width : 0
        style : NoPen
      fill:
        color : '@Origin'
        style : SolidPattern
  Segment:
    line:
      unresolved:
        color : '@SegmentUnresolved'
        width : 1
        style : SolidLine
      scalar:
        color : '@SegmentScalar'
        width : 1
        style : SolidLine
      vector:
        color : '@SegmentVector'
        width : 2
        style : SolidLine
  SegmentPreview1:
    line:
      color : '@Background'
      width : 1
      style : SolidLine
  SegmentPreview2:
    line:
      color : '@SegmentPreview2'
      width : 1
      style : DashDotDotLine
  Tap:
    line:
      unresolved:
        color : '@TapUnresolved'
        width : 1
        style : SolidLine
      scalar:
        color : '@TapScalar'
        width : 1
        style : SolidLine
      vector:
        color : '@TapVector'
        width : 2
        style : SolidLine
  NetLabel:
    text:
      color     : '@Origin'
      font      : 'Liberation Sans'
      size      : 7
      bold      : false
      italic    : false
      underline : false
  Port:
    pin:
      wire:
        line:
          color : '@Origin'
          width : 1
          style : SolidLine
      bus:
        line:
          color : '@Origin'
          width : 2
          style : SolidLine
    arrow:
      size : 6
      line:
        color : '@Origin'
        width : 1
        style : SolidLine
      fill:
        color : '@Sheet'
        style : SolidPattern
  PortName:
    text:
      color     : '@Origin'
      font      : 'Liberation Sans'
      size      : 7
      bold      : false
      italic    : false
      underline : false
  PortComment:
    text:
      color     : '@Origin'
      font      : 'Liberation Sans'
      size      : 7
      bold      : false
      italic    : false
      underline : false
  Gate:
    line:
      color : '@Origin'
      width : 1
      style : SolidLine
    fill:
      color : '@Sheet'
      style : NoBrush
  GatePin:
    pin:
      wire:
        line:
          color : '@Origin'
          width : 1
          style : SolidLine
      bus:
        line:
          color : '@Origin'
          width : 2
          style : SolidLine
      dot:
        size : 2.5
      clock:
        size : 2.5
    arrow:
      size : 3
      line:
        color : '@Sheet'
        width : 0.5
        style : SolidLine
      fill:
        color : '@Sheet'
        style : SolidPattern
  Block:
    line:
      color : '@Origin'
      width : 1
      style : SolidLine
    fill:
      color : '@Sheet'
      style : SolidPattern
  BlockLabel:
    text:
      color     : '@Origin'
      font      : 'Liberation Sans'
      size      : 7
      bold      : false
      italic    : false
      underline : false
  BlockName:
    text:
      color     : '@Origin'
      font      : 'Liberation Sans'
      size      : 7
      bold      : false
      italic    : false
      underline : false
  BlockPin:
    pin:
      wire:
        line:
          color : '@Origin'
          width : 1
          style : SolidLine
      bus:
        line:
          color : '@Origin'
          width : 2
          style : SolidLine
    arrow:
      size : 6
      line:
        color : '@Origin'
        width : 1
        style : SolidLine
      fill:
        color : '@Sheet'
        style : SolidPattern
  BlockPinName:
    text:
      color     : '@Origin'
      font      : 'Liberation Sans'
      size      : 7
      bold      : false
      italic    : false
      underline : false
  BlockPinComment:
    text:
      color     : '@Origin'
      font      : 'Liberation Sans'
      size      : 7
      bold      : false
      italic    : false
      underline : false
  SymbolPin:
    pin:
      wire:
        line:
          color : '@Origin'
          width : 1
          style : SolidLine
      bus:
        line:
          color : '@Origin'
          width : 2
          style : SolidLine
      dot:
        size : 2.5
      clock:
        size : 2.5
    arrow:
      size : 3
      line:
        color : '@Origin'
        width : 0.5
        style : SolidLine
      fill:
        color : '@Sheet'
        style : SolidPattern
  SymbolPinName:
    text:
      color     : '@Origin'
      font      : 'Liberation Sans'
      size      : 7
      bold      : false
      italic    : false
      underline : false
  SymbolPinComment:
    text:
      color     : '@Origin'
      font      : 'Liberation Sans'
      size      : 7
      bold      : false
      italic    : false
      underline : false
  PropertyText:
    text:
      color     : '@Origin'
      font      : 'Liberation Sans'
      size      : 7
      bold      : false
      italic    : false
      underline : false
  Line:
    line:
      color : '@Origin'
      width : 1
      style : SolidLine
  Rectangle:
    line:
      color : '@RectangleLine'
      width : 1
      style : SolidLine
    fill:
      color : '@RectangleFill'
      style : NoBrush
  Ellipse:
    line:
      color : '@EllipseLine'
      width : 1
      style : SolidLine
    fill:
      color : '@EllipseFill'
      style : NoBrush
  Polyline:
    line:
      color : '@PolylineLine'
      width : 1
      style : SolidLine
    fill:
      color : '@PolylineFill'
      style : NoBrush
  Text:
    text:
      color     : '@Origin'
      font      : 'Liberation Sans'
      size      : 7
      bold      : false
      italic    : false
      underline : false
selected:
  line:
    color : '@SelectedLine'
  fill:
    color : '@SelectedFill'
  text:
    color : '@SelectedText'
  items:
    FreeNode:
      line:
        style : SolidLine
grip:
  size : 12
  line:
    color : '@SelectedLine'
    width : 0
    style : NoPen
  fill:
    color : '@SelectedLine'
    style : SolidPattern
tether:
  line:
    color : '@SelectedLine'
    width : 0
    style : DotLine
rubber:
  line:
    color : '@Rubber'
    width : 0
    style : DotLine
grid:
  line : '@Grid'
properties:
  deleted:
    color : '@PropertyDeleted'
  changed:
    color : '@PropertyChanged'
  added:
    color : '@PropertyAdded'
