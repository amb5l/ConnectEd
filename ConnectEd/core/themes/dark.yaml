meta:
  id           : dark
  display_name : Dark
palette:
  # basic colours
  black         : '#000000'
  dark_red      : '#200000'
  dark_yellow   : '#202000'
  dark_green    : '#002000'
  dark_cyan     : '#002020'
  dark_blue     : '#000020'
  dark_magenta  : '#200020'
  dark_grey     : '#202020'
  dull_red      : '#400000'
  dull_yellow   : '#404000'
  dull_green    : '#004000'
  dull_cyan     : '#004040'
  dull_blue     : '#000040'
  dull_magenta  : '#400040'
  dull_grey     : '#404040'
  mid_red       : '#800000'
  mid_yellow    : '#808000'
  mid_green     : '#008000'
  mid_cyan      : '#008080'
  mid_blue      : '#000080'
  mid_magenta   : '#800080'
  mid_grey      : '#808080'
  light_red     : '#C00000'
  light_yellow  : '#C0C000'
  light_green   : '#00C000'
  light_cyan    : '#00C0C0'
  light_blue    : '#0000C0'
  light_magenta : '#C000C0'
  light_grey    : '#C0C0C0'
  max_red       : '#FF0000'
  max_yellow    : '#FFFF00'
  max_green     : '#00FF00'
  max_cyan      : '#00FFFF'
  max_blue      : '#0000FF'
  max_magenta   : '#FF00FF'
  max_white     : '#FFFFFF'
  # fancy colours
  dark          : '#141414'
  mint          : '#3DC9B0'
  rose          : '#CC7C8A'
  orchid        : '#E394DC'
  peach         : '#E0AF80'
  warm_gold     : '#EBC88A'
  apricot       : '#EFB080'
  bright_gold   : '#FCD500'
  teal          : '#82D2CE'
  lavender      : '#AAA0FA'
  sky_blue      : '#85C2FF'
  # functional colours
  highlight     : '#FFFF00'
presets:
  Background           : black
  Origin               : max_white
  Sheet                : dark
  Border               : dull_grey
  Grid                 : dark_grey
  FreeNodeUnconnected  : highlight
  FreeNodeConnected    : highlight
  FreeNodeJunction     : rose
  FixedNodeUnconnected : highlight
  FixedNodeConnected   : highlight
  FixedNodeJunction    : rose
  SegmentUnresolved    : highlight
  SegmentScalar        : mint
  SegmentVector        : mint
  SegmentPreview1      : max_magenta
  SegmentPreview2      : max_magenta
  TapUnresolved        : highlight
  TapScalar            : teal
  TapVector            : teal
  NetLabel             : warm_gold
  PortPinWire          : mid_grey
  PortPinBus           : mid_grey
  PortArrowLine        : mid_grey
  PortArrowFill        : apricot
  PortName             : apricot
  PortComment          : apricot
  GateLine             : mid_grey
  GateFill             : dull_grey
  GatePinWire          : mid_grey
  GatePinBus           : mid_grey
  GatePinArrowLine     : apricot
  GatePinArrowFill     : apricot
  BlockLine            : mid_grey
  BlockFill            : dull_grey
  BlockLabel           : sky_blue
  BlockName            : sky_blue
  BlockPinWire         : mid_grey
  BlockPinBus          : mid_grey
  BlockPinArrowLine    : apricot
  BlockPinArrowFill    : apricot
  BlockPinName         : apricot
  BlockPinComment      : light_grey
  SymbolPinWire        : mid_grey
  SymbolPinBus         : mid_grey
  SymbolPinArrowLine   : apricot
  SymbolPinArrowFill   : apricot
  SymbolPinName        : apricot
  SymbolPinComment     : light_grey
  PropertyText         : orchid
  Line                 : mid_grey
  RectangleLine        : mid_grey
  RectangleFill        : dull_grey
  EllipseLine          : mid_grey
  EllipseFill          : dull_grey
  PolyVtx              : dull_grey
  PolylineLine         : mid_grey
  PolylineFill         : dull_grey
  Text                 : mid_grey
  SelectedLine         : max_magenta
  SelectedFill         : mid_magenta
  SelectedText         : max_magenta
  Grip                 : max_magenta
  Rubber               : highlight
  PropertyDeleted      : dark_red
  PropertyChanged      : dark_yellow
  PropertyAdded        : dark_green
background : '@Background'
origin:
  color : '@Origin'
  size  : 12
sheet  : '@Sheet'
border : '@Border'
items:
  FreeNode:
    size : 3
    unconnected:
      line:
        color : '@FreeNodeUnconnected'
        width : 0
        style : SolidLine
      fill:
        color : '@FreeNodeUnconnected'
        style : NoBrush
    connected:
      line:
        color : '@FreeNodeUnconnected'
        width : 0
        style : NoPen
      fill:
        color : '@FreeNodeUnconnected'
        style : NoBrush
    junction:
      line:
        color : '@FreeNodeJunction'
        width : 0
        style : NoPen
      fill:
        color : '@FreeNodeJunction'
        style : SolidPattern
  FixedNode:
    size : 3
    unconnected:
      line:
        color : '@FreeNodeUnconnected'
        width : 0
        style : SolidLine
      fill:
        color : '@FreeNodeUnconnected'
        style : NoBrush
    connected:
      line:
        color : '@FreeNodeUnconnected'
        width : 0
        style : NoPen
      fill:
        color : '@FreeNodeUnconnected'
        style : NoBrush
    junction:
      line:
        color : '@FreeNodeJunction'
        width : 0
        style : NoPen
      fill:
        color : '@FreeNodeJunction'
        style : SolidPattern
  Segment:
    line:
      unresolved:
        color : '@SegmentUnresolved'
        width : 0.5
        style : SolidLine
      scalar:
        color : '@SegmentScalar'
        width : 1
        style : SolidLine
      vector:
        color : '@SegmentVector'
        width : 2
        style : SolidLine
  SegmentPreview1:
    line:
      color : '@SegmentPreview1'
      width : 1
      style : SolidLine
  SegmentPreview2:
    line:
      color : '@SegmentPreview2'
      width : 1
      style : DashDotDotLine
  Tap:
    line:
      unresolved:
        color : '@TapUnresolved'
        width : 0.5
        style : SolidLine
      scalar:
        color : '@TapScalar'
        width : 1
        style : SolidLine
      vector:
        color : '@TapVector'
        width : 2
        style : SolidLine
  NetLabel:
    text:
      color     : '@NetLabel'
      font      : 'Liberation Sans'
      size      : 5
      bold      : false
      italic    : false
      underline : false
  Port:
    pin:
      wire:
        line:
          color : '@PortPinWire'
          width : 1
          style : SolidLine
      bus:
        line:
          color : '@PortPinBus'
          width : 2
          style : SolidLine
    arrow:
      size : 6
      line:
        color : '@PortArrowLine'
        width : 1
        style : SolidLine
      fill:
        color : '@PortArrowFill'
        style : SolidPattern
  PortName:
    text:
      color     : '@PortArrowFill'
      font      : 'Liberation Sans'
      size      : 7
      bold      : false
      italic    : false
      underline : false
  PortComment:
    text:
      color     : '@PortArrowFill'
      font      : 'Liberation Sans'
      size      : 7
      bold      : false
      italic    : false
      underline : false
  Gate:
    line:
      color : '@GateLine'
      width : 1
      style : SolidLine
    fill:
      color : '@GateFill'
      style : SolidPattern
  GatePin:
    pin:
      wire:
        line:
          color : '@GatePinWire'
          width : 1
          style : SolidLine
      bus:
        line:
          color : '@GatePinBus'
          width : 2
          style : SolidLine
      dot:
        size : 2.5
      clock:
        size : 2.5
    arrow:
      size : 3
      line:
        color : '@GatePinArrowLine'
        width : 0.5
        style : SolidLine
      fill:
        color : '@GatePinArrowFill'
        style : SolidPattern
  Block:
    line:
      color : '@BlockLine'
      width : 1
      style : SolidLine
    fill:
      color : '@BlockFill'
      style : SolidPattern
  BlockLabel:
    text:
      color     : '@BlockLabel'
      font      : 'Liberation Sans'
      size      : 7
      bold      : false
      italic    : false
      underline : false
  BlockName:
    text:
      color     : '@BlockLabel'
      font      : 'Liberation Sans'
      size      : 7
      bold      : false
      italic    : false
      underline : false
  BlockPin:
    pin:
      wire:
        line:
          color : '@BlockPinWire'
          width : 1
          style : SolidLine
      bus:
        line:
          color : '@BlockPinBus'
          width : 2
          style : SolidLine
    arrow:
      size : 6
      line:
        color : '@BlockPinArrowLine'
        width : 1
        style : SolidLine
      fill:
        color : '@BlockPinArrowFill'
        style : SolidPattern
  BlockPinName:
    text:
      color     : '@PortArrowFill'
      font      : 'Liberation Sans'
      size      : 7
      bold      : false
      italic    : false
      underline : false
  BlockPinComment:
    text:
      color     : '@PortArrowFill'
      font      : 'Liberation Sans'
      size      : 7
      bold      : false
      italic    : false
      underline : false
  SymbolPin:
    pin:
      wire:
        line:
          color : '@SymbolPinWire'
          width : 1
          style : SolidLine
      bus:
        line:
          color : '@SymbolPinBus'
          width : 2
          style : SolidLine
      dot:
        size : 2.5
      clock:
        size : 2.5
    arrow:
      size : 3
      line:
        color : '@SymbolPinArrowLine'
        width : 0.5
        style : SolidLine
      fill:
        color : '@SymbolPinArrowFill'
        style : SolidPattern
  SymbolPinName:
    text:
      color     : '@SymbolPinName'
      font      : 'Liberation Sans'
      size      : 7
      bold      : false
      italic    : false
      underline : false
  SymbolPinComment:
    text:
      color     : '@SymbolPinComment'
      font      : 'Liberation Sans'
      size      : 7
      bold      : false
      italic    : false
      underline : false
  PropertyText:
    text:
      color     : '@PropertyText'
      font      : 'Liberation Sans'
      size      : 7
      bold      : false
      italic    : false
      underline : false
  Line:
    line:
      color : '@Line'
      width : 1
      style : SolidLine
  Rectangle:
    line:
      color : '@RectangleLine'
      width : 1
      style : SolidLine
    fill:
      color : '@RectangleFill'
      style : NoBrush
  Ellipse:
    line:
      color : '@EllipseLine'
      width : 1
      style : SolidLine
    fill:
      color : '@EllipseFill'
      style : NoBrush
  Polyline:
    line:
      color : '@PolylineLine'
      width : 1
      style : SolidLine
    fill:
      color : '@PolylineFill'
      style : NoBrush
  Text:
    text:
      color     : '@Text'
      font      : 'Liberation Sans'
      size      : 7
      bold      : false
      italic    : false
      underline : false
selected:
  line:
    color : '@SelectedLine'
  fill:
    color : '@SelectedFill'
  text:
    color : '@SelectedText'
  items:
    FreeNode:
      line:
        style : SolidLine
grip:
  size : 12
  line:
    color : '@SelectedLine'
    width : 0
    style : NoPen
  fill:
    color : '@SelectedLine'
    style : SolidPattern
tether:
  line:
    color : '@SelectedLine'
    width : 0
    style : DotLine
rubber:
  line:
    color : '@Rubber'
    width : 0
    style : DotLine
grid:
  line : '@Grid'
properties:
  deleted:
    color : '@PropertyDeleted'
  changed:
    color : '@PropertyChanged'
  added:
    color : '@PropertyAdded'
